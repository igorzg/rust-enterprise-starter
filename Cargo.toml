[package]
name = "rstarter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Production-ready Rust REST API starter with hexagonal architecture (standalone core plus HTTP and persistence adapters)"

[lib]
name = "rstarter"
path = "src/lib.rs"

[[bin]]
name = "rstarter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
rust-i18n = "4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "compression-gzip",
    "limit",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
